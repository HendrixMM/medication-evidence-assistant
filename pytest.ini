[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10

markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions or external services
    asyncio: Async tests handled by pytest-asyncio when installed
    api: API endpoint tests
    medical: Medical retrieval and evidence tests
    safety: Guardrail and safety tests
    slow: Tests that take longer than 5 seconds
    live: Tests requiring live external API access
    monitoring: Runtime monitoring tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
